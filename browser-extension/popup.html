<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>云析下载助手</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="head">
    <img class="logo" src="icons/icon32.png" alt="" />
    <div class="brand">
      <div class="title">云析下载助手</div>
      <div class="status" id="status">
        <span class="dot"></span><span id="status-text">检测中…</span>
      </div>
    </div>
    <div class="tools">
      <div class="seg" id="theme-seg" role="group" aria-label="外观">
        <button type="button" class="seg-btn" data-theme-value="auto" title="跟随浏览器">自动</button>
        <button type="button" class="seg-btn" data-theme-value="light" title="始终使用亮色">亮</button>
        <button type="button" class="seg-btn" data-theme-value="dark" title="始终使用暗色">暗</button>
      </div>
      <button type="button" class="icon-btn" id="refresh" title="刷新资源列表" aria-label="刷新">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36" />
          <path d="M21 3v6h-6" />
        </svg>
      </button>
    </div>
  </header>

  <section class="cd-banner" id="cd-banner" hidden>
    <div class="cd-text">
      <div class="cd-title">已停止捕获此网站的下载</div>
      <div class="cd-sub">还有 <b class="cd-time" id="cd-time">0 分 00 秒</b> 自动重新开始捕获</div>
    </div>
    <button type="button" class="cd-btn" id="cd-resume">立即重新开始</button>
  </section>

  <section class="vcard-card" id="video-card" hidden>
    <div class="vcard-head">
      <span class="vcard-badge" id="vcard-badge"></span>
      <span class="vcard-id" id="vcard-id"></span>
    </div>
    <div class="vcard-title" id="vcard-title">正在读取视频信息…</div>
    <div class="vcard-fields" id="vcard-fields">
      <label class="vcard-field">
        <span class="vcard-label">清晰度</span>
        <select class="vcard-select" id="video-quality"></select>
      </label>
      <label class="vcard-field">
        <span class="vcard-label">下载方式</span>
        <select class="vcard-select" id="video-mode">
          <option value="merge">普通下载（音视频合并）</option>
          <option value="video">仅视频</option>
          <option value="audio">仅音频</option>
          <option value="separate">视频＋音频（不合并）</option>
        </select>
      </label>
    </div>
    <button type="button" class="vcard-btn" id="video-download">交给云析下载</button>
    <div class="vcard-hint" id="video-hint"></div>
  </section>

  <section class="card">
    <label class="row">
      <div class="row-text">
        <div class="row-title">启用插件</div>
        <div class="row-sub">关闭后不再嗅探与接管</div>
      </div>
      <span class="switch">
        <input type="checkbox" id="sw-enabled" />
        <span class="track"><span class="knob"></span></span>
      </span>
    </label>
    <label class="row">
      <div class="row-text">
        <div class="row-title">接管浏览器下载</div>
        <div class="row-sub">下载交给云析，由云析询问保存位置与线程数</div>
      </div>
      <span class="switch">
        <input type="checkbox" id="sw-hijack" />
        <span class="track"><span class="knob"></span></span>
      </span>
    </label>
    <label class="row">
      <div class="row-text">
        <div class="row-title">嗅探页面资源</div>
        <div class="row-sub">在下方列出当前页面可下载的媒体与文件</div>
      </div>
      <span class="switch">
        <input type="checkbox" id="sw-sniff" />
        <span class="track"><span class="knob"></span></span>
      </span>
    </label>
  </section>

  <section class="list-head">
    <span class="list-title">当前页面资源</span>
    <span class="count" id="count">0</span>
  </section>

  <div class="filters" id="filters" hidden></div>

  <div class="list" id="list">
    <div class="empty">
      <div class="empty-title">暂无嗅探到的资源</div>
      <div class="empty-sub">播放视频或点击页面上的下载按钮后再试</div>
    </div>
  </div>

  <footer class="foot">
    <span id="hint">资源列表仅在本机与云析之间传递，不上传任何数据。</span>
  </footer>

  <div class="preview" id="preview" hidden>
    <div class="preview-bar">
      <span class="preview-name" id="preview-name"></span>
      <button type="button" class="preview-close" id="preview-close" aria-label="关闭">×</button>
    </div>
    <div class="preview-body" id="preview-body"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
